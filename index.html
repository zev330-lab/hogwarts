<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hogwarts">
<meta name="theme-color" content="#111b22">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Havi's own little world of witches, wizards, and wonderful magic.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Havi's Hogwarts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
:root {
  --paper:#faf4e7;
  --card:#fffdf7;
  --ink:#302c3c;
  --muted:#72677a;
  --purple:#655183;
  --gold:#ad7931;
  --line:#e7dcc8;
  --mint:#dcece4;
  --display:"Cormorant Garamond",Georgia,serif;
  --body:"Atkinson Hyperlegible","Trebuchet MS",sans-serif;
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
  touch-action: manipulation;
}
button:active {
  transform: translateY(1px);
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid #a676d2;
  outline-offset: 3px;
}
[hidden] {
  display: none !important;
}
button {
  min-height: 48px;
}
button:disabled {
  opacity: .5;
  cursor: default;
}
svg {
  display: block;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-family: var(--display);
  font-weight: 600;
  line-height: 1.15;
}
h1 {
  font-size: 34px;
  letter-spacing: -1.1px;
}
h2 {
  font-size: 25px;
}
h3 {
  font-size: 20px;
}
p {
  line-height: 1.5;
}
small,
.fine {
  font-size: 14px;
  color: var(--muted);
}
.icon {
  width: 23px;
  height: 23px;
  flex: none;
  display: inline-block;
  vertical-align: middle;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 2.3px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--gold);
}
#app {
  max-width: 560px;
  margin: auto;
  padding: 0 18px calc(132px + env(safe-area-inset-bottom, 0px));
}
html {
  scroll-padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
}
button,
input,
select,
textarea {
  scroll-margin-block: 18px 115px;
}
.mast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(15px + env(safe-area-inset-top, 0px)) 0 17px;
  border-bottom: 1px solid var(--line);
}
.brand {
  border: 0;
  background: none;
  text-align: left;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
}
.brandmark {
  color: #9b7138;
  background: #efe4cf;
  border: 1px solid #d8c19a;
  border-radius: 14px;
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
}
.brand-name {
  font-family: var(--display);
  font-size: 21px;
  line-height: 1.1;
}
.brand-name small {
  display: block;
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-top: 4px;
}
.round {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  flex: none;
}
.round[aria-pressed=true] {
  color: #fff;
  background: var(--purple);
  border-color: var(--purple);
}
.intro {
  padding: 24px 3px 19px;
}
.intro .eyebrow {
  margin-bottom: 7px;
}
.intro p {
  margin-top: 9px;
  font-size: 16px;
  color: var(--muted);
}
.intro-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.intro-row > div {
  min-width: 0;
}
.intro h1 {
  overflow-wrap: anywhere;
}
.intro .back {
  margin-left: -4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 15px;
  width: 48px;
  flex: none;
  display: grid;
  place-items: center;
}
.intro .back svg {
  width: 20px;
}
#stage-wrap {
  position: relative;
  margin-bottom: 18px;
  z-index: 2;
}
#stage {
  height: 316px;
  position: relative;
  border-radius: 26px;
  overflow: hidden;
  background: #182c3d;
  isolation: isolate;
  border: 1px solid #cdbb9b;
  box-shadow: 0 9px 23px -17px #302239;
}
#stage canvas.gl,
#fallback {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#fallback > svg {
  width: 100%;
  height: 100%;
}
#stage.is3d #fallback {
  display: none;
}
#stage canvas.gl {
  z-index: 1;
}
.stage-label {
  position: absolute;
  left: 10px;
  top: 10px;
  color: #f5e7c8;
  font-size: 10px;
  letter-spacing: 1.2px;
  max-width: calc(100% - 72px);
  background: #18263ee8;
  border: 1px solid #eddab540;
  border-radius: 20px;
  padding: 7px 10px;
  z-index: 3;
  pointer-events: none;
}
.stage-help {
  position: absolute;
  bottom: 12px;
  left: 12px;
  max-width: calc(100% - 80px);
  border: 1px solid #f7e9c329;
  background: #1c283cc7;
  color: #f9f0df;
  white-space: normal;
  border-radius: 20px;
  font-size: 11px;
  padding: 5px 11px;
  z-index: 3;
  pointer-events: none;
}
.stage-reset {
  position: absolute;
  right: 9px;
  top: 6px;
  z-index: 4;
  color: #f5e7c8;
  background: #192a3c70;
  border: 0;
  border-radius: 50%;
  width: 48px;
  display: grid;
  place-items: center;
}
.stage-reset .icon {
  width: 18px;
}
#effect-label {
  position: absolute;
  top: 54px;
  left: 20px;
  right: 20px;
  text-align: center;
  color: #fff6d8;
  font-family: var(--display);
  font-size: 23px;
  text-shadow: 0 2px 6px #141524;
  z-index: 4;
  pointer-events: none;
}
#fx2d {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}
.spark svg {
  width: 34px;
  height: 38px;
}
.spark {
  position: absolute;
  font-size: 26px;
  color: var(--spark,#ffe49a);
  animation: spark 2.5s ease-out forwards;
}
@keyframes spark {
  0% {
    transform: translate(0, 80px) scale(.1);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  100% {
    transform: translate(var(--dx), -160px) rotate(170deg);
    opacity: 0;
  }
}
.editor-mode #stage {
  height: 280px;
}
.editor-mode #stage-wrap {
  position: sticky;
  top: 8px;
  background: var(--paper);
  padding-bottom: 8px;
}
.home-mode #stage {
  height: 292px;
}
.stage-foot {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
}
.stage-foot::before,
.stage-foot::after {
  content: "✧";
  color: var(--gold);
}
#content {
  display: grid;
  gap: 20px;
}
.btn {
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--card);
  padding: 12px 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  min-height: 50px;
  text-decoration: none;
  line-height: 1.3;
}
.btn.primary {
  background: var(--purple);
  color: white;
  border-color: var(--purple);
  box-shadow: 0 4px 0 #49365e;
}
.btn.gold {
  background: #efcc88;
  color: #49351b;
  border-color: #dfba73;
  box-shadow: 0 4px 0 #c39a54;
}
.btn.wide {
  width: 100%;
}
.btn.soft {
  background: #eee7f3;
  border-color: #ded3e9;
  color: #594371;
}
.btn.danger {
  color: #a13946;
  border-color: #e1bcc2;
  background: #fff5f5;
}
.row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.row > * {
  min-width: 0;
}
.row.equal > * {
  flex: 1;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.section-head small {
  font-size: 12px;
}
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  margin-top: 2px;
}
.divider:before,
.divider:after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 21px;
  padding: 18px;
  display: grid;
  gap: 15px;
}
.panel.lavender {
  background: #f1ebf6;
  border-color: #e0d5e9;
}
.panel.green {
  background: #edf4ed;
  border-color: #cfded1;
}
.panel .fine {
  line-height: 1.4;
}
.stack {
  display: grid;
  gap: 16px;
}
.cards,
.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.character-card {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card);
  overflow: hidden;
  text-align: center;
}
.character-card > button {
  width: 100%;
  border: 0;
  background: none;
  padding: 0 0 15px;
}
.portrait {
  height: 168px;
  background:
    radial-gradient(
      ellipse at 50% 70%,
      #e5ded6,
      #f1e9de);
  border-bottom: 1px solid var(--line);
  margin-bottom: 13px;
}
.portrait svg {
  width: 100%;
  height: 100%;
}
.character-card h3 {
  font-size: 19px;
  margin: 0 9px 4px;
  overflow-wrap: anywhere;
}
.character-card small {
  font-size: 12px;
}
.card-menu {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 48px !important;
  height: 48px;
  background: #fff9 !important;
  border-radius: 50%;
  padding: 0 !important;
  font-size: 25px;
}
.empty {
  text-align: center;
  padding: 18px 20px 6px;
}
.empty h2 {
  font-size: 24px;
  margin-bottom: 7px;
}
.empty p {
  color: var(--muted);
  font-size: 15px;
}
.tile {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 21px;
  background: #eee8f4;
  min-height: 128px;
  padding: 16px;
  text-align: left;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: 13px;
}
.tile > span:first-child {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: #ffffff8c;
  display: grid;
  place-items: center;
  color: #6c537f;
}
.tile b {
  font-family: var(--display);
  font-size: 19px;
  font-weight: 600;
}
.tile small {
  display: block;
  font-size: 12px;
  margin-top: 4px;
}
.tile:nth-child(4n+2) {
  background: #f2e5cd;
}
.tile:nth-child(4n+3) {
  background: #e2ece3;
}
.tile:nth-child(4n) {
  background: #e0e8f0;
}
.tile .arrow {
  position: absolute;
  right: 13px;
  top: 18px;
  color: #8b7b80;
}
.house-cup {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  text-align: center;
}
.house-cup .crest {
  width: 48px;
  height: 58px;
  margin: auto;
}
.house-cup strong {
  display: block;
  font-family: var(--display);
  font-size: 22px;
  margin-top: 5px;
}
.house-cup small {
  font-size: 10px;
  display: block;
  color: var(--muted);
}
.cup-bar {
  height: 4px;
  border-radius: 3px;
  background: var(--house);
  margin: 8px 8px 0;
}
.crest {
  display: inline-block;
  width: 46px;
  height: 54px;
  vertical-align: middle;
}
.house-picker {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.house-picker button {
  display: grid;
  justify-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 6px;
  background: var(--card);
  font-size: 15px;
}
.house-picker .crest {
  width: 53px;
  height: 64px;
}
.house-picker small {
  font-size: 12px;
}
.quote {
  font-family: var(--display);
  font-size: 22px;
  line-height: 1.4;
  text-align: center;
  color: #604c77;
}
.question {
  font-size: 24px;
  text-align: center;
}
.answers {
  display: grid;
  gap: 9px;
}
.answers .btn {
  text-align: left;
  justify-content: flex-start;
  font-weight: 400;
}
.progress {
  display: flex;
  justify-content: center;
  gap: 7px;
}
.progress i {
  display: block;
  width: 23px;
  height: 5px;
  border-radius: 5px;
  background: #ddd1e6;
}
.progress i.on {
  background: var(--purple);
}
.tabbar {
  display: flex;
  gap: 7px;
  overflow: auto;
  scrollbar-width: none;
  padding: 2px 1px 8px;
}
.tabbar::-webkit-scrollbar {
  display: none;
}
.tabbar button {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 48px;
  padding: 9px 13px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  font-size: 14px;
}
.tabbar button[aria-selected=true] {
  background: var(--ink);
  border-color: var(--ink);
  color: white;
}
.tabbar .icon {
  width: 18px;
}
.choices {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.choice {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 13px;
  min-height: 48px;
  padding: 9px 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 15px;
  flex-grow: 1;
}
.choice[aria-pressed=true] {
  background: #eee6f4;
  border: 2px solid #88739d;
  padding: 8px 12px;
  color: #49365e;
}
.choice .dot {
  width: 21px;
  height: 21px;
  background: var(--swatch);
  border-radius: 50%;
  border: 1px solid #0002;
  display: inline-block;
  box-shadow: inset 0 0 0 3px #ffffff25;
}
.swatches .choice {
  flex: 0;
  width: 50px;
  height: 50px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
}
.swatches .dot {
  width: 34px;
  height: 34px;
}
.field {
  display: grid;
  gap: 9px;
}
.field > label,
.field-label {
  font-size: 15px;
  font-weight: 700;
}
.field input,
.field select,
.field textarea,
input.text {
  width: 100%;
  min-width: 0;
  background: #fffdf8;
  color: var(--ink);
  border: 1px solid #d7c9b3;
  border-radius: 13px;
  padding: 12px;
  min-height: 49px;
  font-size: 17px;
}
.field textarea {
  resize: vertical;
  min-height: 112px;
}
.field input[type=range] {
  padding: 0;
  accent-color: var(--purple);
  border: 0;
}
.field-label small {
  font-weight: 400;
}
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.note {
  border-left: 3px solid #c8a764;
  padding: 0 0 0 13px;
  color: var(--muted);
  font-size: 14px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 20px;
  background: #eee6f4;
  padding: 5px 11px;
  font-size: 12px;
  color: #5d4777;
}
.pet-preview {
  font-size: 38px;
  text-align: center;
}
.pet-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.pet-grid button {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  padding: 8px 4px;
  font-size: 13px;
  min-height: 102px;
}
.pet-grid button[aria-pressed=true] {
  background: #eee6f4;
  border: 2px solid #88739d;
  padding: 7px 3px;
}
.pet-grid svg {
  width: 65px;
  height: 58px;
  margin: auto auto 5px;
}
.spell-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}
.spell-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 13px 9px;
  text-align: left;
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 74px;
}
.spell-card[aria-pressed=true] {
  background: #eee6f4;
  border: 2px solid #88739d;
  padding: 12px 8px;
}
.spell-card b {
  font-size: 14px;
  display: block;
  overflow-wrap: anywhere;
}
.spell-card small {
  display: block;
  font-size: 12px;
}
.spell-card .symbol {
  font-size: 23px;
}
.trace-box {
  border: 1px dashed #b49bc7;
  border-radius: 17px;
  background: #f8f3fd;
  position: relative;
  overflow: hidden;
}
.trace-box canvas {
  display: block;
  width: 100%;
  height: 144px;
  touch-action: none;
}
.trace-box .fine {
  text-align: center;
  display: block;
  padding: 0 5px 8px;
  font-size: 12px;
}
.spell-title {
  display: flex;
  gap: 10px;
  align-items: center;
}
.spell-title > span {
  font-size: 31px;
}
.spell-title h2 {
  font-size: 23px;
}
.spell-title p {
  font-size: 14px;
  color: var(--muted);
}
.syllables {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.syllables button {
  border: 1px solid #d4c4e0;
  border-radius: 12px;
  background: #f3ecf8;
  padding: 9px 12px;
  color: #614b7b;
}
.letter {
  background: #fff8e5;
  padding: 25px 22px;
  border: 1px solid #dfc99b;
  border-radius: 4px;
  box-shadow: 0 6px 18px #563e2110;
  display: grid;
  gap: 17px;
  position: relative;
}
.letter:before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid #e7d5ad;
  pointer-events: none;
}
.letter h2 {
  text-align: center;
  font-size: 25px;
}
.letter p {
  font-size: 16px;
}
.letter .signature {
  font-family: var(--display);
  font-style: italic;
  color: #87632d;
}
.seal {
  border: 5px double #b55b60;
  border-radius: 50%;
  width: 78px;
  height: 78px;
  min-height: 78px;
  background: #a44852;
  color: #ffe6ab;
  box-shadow: 0 6px 0 #82353f, 0 9px 14px #682e3733;
  margin: 10px auto;
  font-family: var(--display);
  font-size: 30px;
}
.owl-flight {
  animation: owlFlight 2.2s ease-in-out;
  transform-origin: center;
  margin: auto;
  width: 110px;
  height: 90px;
}
.owl-flight svg {
  width: 100%;
  height: 100%;
}
@keyframes owlFlight {
  from {
    transform: translate(-150px, -80px) rotate(-20deg);
    opacity: 0;
  }
  60% {
    transform: translate(15px, 0) rotate(10deg);
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.inbox-letter {
  padding: 15px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 14px;
}
.inbox-letter p {
  overflow-wrap: anywhere;
  margin-top: 7px;
}
.inbox-letter small {
  display: block;
}
.map-path {
  display: grid;
  gap: 11px;
}
.map-stop {
  display: flex;
  gap: 14px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 19px;
  padding: 15px;
  text-align: left;
}
.map-stop > span {
  background: #f0e7d7;
  border-radius: 15px;
  min-width: 49px;
  height: 49px;
  display: grid;
  place-items: center;
}
.map-stop h3 {
  font-size: 20px;
}
.map-stop small {
  display: block;
  margin-top: 4px;
}
.map-stop .icon {
  color: #8c6d3e;
}
.map-stop > div {
  flex: 1;
}
#nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 560px);
  z-index: 20;
  background: #faf4e7;
  box-shadow: 0 -6px 18px #302c3c0a;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 8px 12px calc(9px + env(safe-area-inset-bottom, 0px));
}
#nav button {
  border: 0;
  background: none;
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 5px;
  font-size: 11px;
  color: #827486;
  border-radius: 13px;
  min-height: 54px;
}
#nav button.active {
  color: #5f467b;
  background: #ece4f0;
}
#nav .icon {
  width: 22px;
  height: 22px;
}
#toast {
  position: relative;
  width: 100%;
  margin: 0 0 18px;
  padding: 12px 18px;
  background: #342c43;
  color: #fff8e9;
  border-radius: 15px;
  box-shadow: 0 4px 22px #30203a30;
  z-index: 1;
  text-align: center;
  font-size: 15px;
  pointer-events: none;
}
#moment {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  overflow: hidden;
  border-radius: inherit;
}
#moment:empty {
  display: none;
}
.house-moment {
  height: 100%;
  background:
    linear-gradient(
      160deg,
      var(--house-glow),
      transparent 60%);
  animation: roomCheer 5.4s both;
}
.house-shout {
  position: absolute;
  top: 55px;
  left: 6px;
  right: 6px;
  text-align: center;
  color: #fff8d5;
  font: 700 clamp(27px, 8vw, 41px)/1.1 var(--display);
  text-shadow: 0 3px 0 #32263e, 0 0 20px var(--house-glow);
  animation: shout .6s both;
}
.house-shout small {
  display: block;
  color: #fff2c6;
  font: 700 11px var(--body);
  letter-spacing: 2px;
  margin-bottom: 4px;
}
.house-visitor {
  position: absolute;
  right: 14px;
  bottom: 64px;
  width: 80px;
  color: #fff4d5;
  text-align: center;
  font-size: 12px;
  animation: animalHello 5.4s both;
}
.house-visitor svg {
  width: 80px;
  height: 85px;
  filter: drop-shadow(0 0 12px var(--house-glow));
}
.sorting-result h2 {
  font-size: clamp(32px, 10vw, 42px);
  color: var(--house);
}
.sorting-result .crest {
  width: 78px;
  height: 88px;
  margin: auto;
}
.sorting-result {
  border: 2px solid var(--house);
}
.wand-moment {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      ellipse at 65% 50%,
      #ffe7a075,
      transparent 64%);
  animation: goldBurst 3.5s both;
}
.wand-moment b {
  position: absolute;
  left: 12px;
  right: 12px;
  top: 57px;
  color: #fff4c1;
  font: 600 26px var(--display);
  text-align: center;
  text-shadow: 0 2px 8px #573923;
}
@keyframes shout {
  from {
    transform: scale(.35);
    opacity: 0;
  }
  70% {
    transform: scale(1.08);
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}
@keyframes roomCheer {
  0% {
    opacity: 0;
  }
  8%, 75% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}
@keyframes animalHello {
  0%, 8% {
    transform: translateY(55px) scale(.2);
    opacity: 0;
  }
  20%, 75% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-15px);
    opacity: 0;
  }
}
@keyframes goldBurst {
  0% {
    opacity: 0;
    transform: scale(.7);
  }
  14% {
    opacity: 1;
    transform: scale(1);
  }
  75% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}
.envelope {
  position: relative;
  background:
    linear-gradient(
      145deg,
      #f3dfb3,
      #fff3d0);
  padding: 50px 14px 14px;
  border: 1px solid #cdb58a;
  border-radius: 8px;
  box-shadow: 0 7px 18px #66533520;
  text-align: center;
}
.envelope:before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 90px;
  background:
    linear-gradient(
      150deg,
      #e7cd9b,
      #fff3d6);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.envelope p {
  position: relative;
  z-index: 1;
}
.envelope .seal {
  position: relative;
}
.seal.breaking {
  animation: sealBreak .28s both;
}
@keyframes sealBreak {
  to {
    transform: rotate(-22deg) scale(1.4);
    opacity: 0;
  }
}
.delivery {
  position: relative;
  height: 135px;
}
.delivery .owl-flight {
  width: 125px;
  height: 125px;
  position: relative;
}
.delivery-envelope {
  position: absolute;
  bottom: 0;
  left: 39px;
  width: 49px;
  height: 32px;
  border: 1px solid #ba9b63;
  border-radius: 3px;
  background: #f8e8bc;
  transform: rotate(-7deg);
}
.delivery-envelope:before {
  content: "";
  position: absolute;
  inset: 0;
  clip-path: polygon(0 0, 100% 0, 50% 65%);
  background: #dfc996;
}
.delivery-envelope:after {
  content: "H";
  position: absolute;
  left: 19px;
  top: 11px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #ab3b47;
  color: #ffdda6;
  font: 9px Georgia;
}
.delivery-wing {
  position: absolute;
  width: 70px;
  height: 35px;
  top: 47px;
  border-radius: 80% 10% 70% 10%;
  background: #e6e3d9;
  border-bottom: 3px solid #c3bdad;
  transform-origin: right center;
  left: -39px;
  animation: wingbeat .45s ease-in-out 5 alternate;
}
.delivery-wing.right {
  left: auto;
  right: -39px;
  transform-origin: left center;
  transform: none;
  border-radius: 10% 80% 10% 70%;
  animation-name: wingbeatRight;
}
@keyframes wingbeat {
  to {
    transform: rotate(32deg);
  }
}
@keyframes wingbeatRight {
  to {
    transform: rotate(-32deg);
  }
}
.letter {
  background:
    radial-gradient(
      ellipse at 10% 20%,
      #b58d3620,
      transparent 50%),
    radial-gradient(
      ellipse at 100% 80%,
      #d5a85333,
      transparent 50%),
    repeating-linear-gradient(
      3deg,
      #fff3d800 0px,
      #b2975710 1px,
      #fff3d800 3px),
    #fff1cf;
  color: #374639;
}
.letter h2,
.letter .eyebrow,
.letter .signature {
  color: #285541;
}
.letter.unfold {
  transform-origin: top;
  animation: unfold .7s both;
}
.letter .school-name {
  font-size: 23px;
}
.letter ul {
  margin: 0;
  padding-left: 22px;
  font-size: 16px;
}
.sky-star {
  animation: twinkle 3s ease-in-out infinite alternate;
}
.svg-candle {
  animation: candleBob 3.2s ease-in-out infinite alternate;
}
.svg-fire {
  transform-origin: 326px 264px;
  animation: fireDance .4s ease-in-out infinite alternate;
}
#fallback.happy .storybook-actor {
  animation: happyBounce 1.3s both;
}
@keyframes twinkle {
  to {
    opacity: .3;
  }
}
@keyframes candleBob {
  to {
    transform: translateY(-4px);
  }
}
@keyframes fireDance {
  to {
    transform: scaleY(.83);
  }
}
@keyframes happyBounce {
  0%, 50%, 100% {
    transform: translateY(0);
  }
  25% {
    transform: translateY(-12px);
  }
  75% {
    transform: translateY(-5px);
  }
}
@keyframes unfold {
  from {
    transform: perspective(700px) rotateX(-75deg) scaleY(.3);
    opacity: .3;
  }
  to {
    transform: perspective(700px) rotateX(0) scaleY(1);
    opacity: 1;
  }
}
@media (max-height: 600px) {
  .editor-mode #stage-wrap {
    position: relative;
    top: auto;
  }
}
#storage-note {
  margin-top: 12px;
  background: #fff1d6;
  color: #6b4b24;
  padding: 12px;
  border-radius: 12px;
  font-size: 13px;
}
dialog {
  border: 1px solid #d4c2a4;
  padding: 25px 22px;
  border-radius: 25px;
  width: min(90vw, 430px);
  max-height: 88dvh;
  overflow: auto;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 18px 100px #100b2a60;
}
dialog::backdrop {
  background: #171827aa;
  backdrop-filter: blur(5px);
}
dialog h2 {
  font-size: 28px;
  margin-bottom: 10px;
}
dialog .close {
  float: right;
  margin: -10px -8px 6px 8px;
}
dialog .dialog-body {
  clear: both;
  display: grid;
  gap: 16px;
}
dialog .dialog-body > h2 {
  text-align: center;
}
dialog .center {
  text-align: center;
}
.celebration {
  position: fixed;
  inset: 0;
  z-index: 70;
  pointer-events: none;
  overflow: hidden;
}
.confetti {
  position: absolute;
  width: 8px;
  height: 16px;
  border-radius: 2px;
  top: -20px;
  animation: fall 2.7s ease-in forwards;
}
@keyframes fall {
  to {
    transform: translate(var(--drift), 105vh) rotate(640deg);
    opacity: .2;
  }
}
.spellbook-pocket {
  position: absolute;
  right: 10px;
  bottom: 10px;
  z-index: 5;
  width: 48px;
  height: 48px;
  min-height: 48px;
  border: 1px solid #dbbf7a70;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #263449dc;
  color: #ffdfa3;
}
.screen-enter {
  animation: enter .25s ease-out;
}
@keyframes enter {
  from {
    opacity: .4;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (min-width: 700px) {
  #app {
    padding-inline: 25px;
  }
  .mast {
    padding-top: 22px;
  }
  #stage {
    height: 370px;
  }
  .editor-mode #stage {
    height: 320px;
  }
  .home-mode #stage {
    height: 340px;
  }
}
@media (max-width: 360px) {
  #app {
    padding-inline: 12px;
  }
  h1 {
    font-size: 30px;
  }
  .mast {
    gap: 5px;
  }
  .brand-name {
    font-size: 19px;
  }
}
#effect-label,
.house-shout,
.wand-moment b {
  top: auto;
  bottom: 8px;
  left: 8px;
  right: 8px;
  padding: 9px 12px;
  border-radius: 14px;
  border: 1px solid #f3daa56b;
  background: #17243bf5;
  color: #fff7df;
  font: 700 20px/1.15 var(--display);
  text-shadow: none;
}
#effect-label:empty {
  display: none;
}
.house-shout {
  font-size: 25px;
}
.house-shout small {
  font-size: 9px;
  margin-bottom: 2px;
  letter-spacing: 1px;
}
.house-visitor {
  right: 8px;
  bottom: 76px;
  width: 64px;
}
.house-visitor svg {
  width: 64px;
  height: 60px;
}
.has-effect .stage-help,
.has-effect .spellbook-pocket {
  visibility: hidden;
}
.editor-mode #stage,
.spells-mode #stage,
.pets-mode #stage {
  height: clamp(174px, 26dvh, 224px);
}
.editor-mode #stage-wrap,
.spells-mode #stage-wrap,
.pets-mode #stage-wrap {
  position: sticky;
  top: 0;
  padding: 6px 0 8px;
  margin-bottom: 10px;
  background: var(--paper);
  z-index: 12;
}
.editor-mode .stage-foot,
.spells-mode .stage-foot,
.pets-mode .stage-foot {
  display: none;
}
.editor-tabs-wrap {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 28px;
  gap: 4px;
  padding-top: 6px;
  align-items: center;
}
.editor-tabs-wrap .tabbar {
  padding: 2px 1px 4px;
  scroll-padding: 4px;
}
.editor-tabs-wrap .tabbar button {
  min-height: 44px;
  padding: 7px 9px;
  font-size: 13px;
  gap: 4px;
}
.tab-scroll {
  border: 0;
  border-radius: 10px;
  background: #ede4d4;
  color: var(--purple);
  font-size: 26px;
  padding: 0;
  min-height: 44px;
}
.spells-mode .mast,
.quiz-mode .mast {
  display: none;
}
.spells-mode .intro,
.quiz-mode .intro {
  padding: 10px 0 12px;
  margin: 0;
}
.spells-mode .intro h1,
.quiz-mode .intro h1 {
  font-size: 27px;
}
.spells-mode .intro .eyebrow,
.quiz-mode .intro .eyebrow {
  display: none;
}
.spells-mode .intro .back,
.quiz-mode .intro .back {
  min-height: 44px;
  height: 44px;
  width: 44px;
}
.spells-mode #content {
  gap: 12px;
}
.spells-mode .tabbar {
  display: grid;
  grid-template-columns: 1fr 1fr 1.3fr;
  gap: 5px;
  overflow: visible;
  padding: 0;
}
.spells-mode .tabbar button {
  padding: 8px 5px;
  font-size: 13px;
  min-width: 0;
  justify-content: center;
  gap: 4px;
}
.spells-mode .tabbar .icon {
  width: 15px;
}
.casting-panel {
  padding: 12px;
  gap: 8px;
}
.casting-panel button,
.casting-panel select,
.casting-panel canvas {
  scroll-margin-block: 8px;
}
.casting-panel .spell-picker-label {
  font-size: 12px;
  font-weight: 700;
}
.casting-panel select {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font-weight: 600;
  min-height: 44px;
  padding: 8px 10px;
  font-size: 17px;
}
.casting-panel .spell-title {
  display: none;
}
.casting-panel .trace-box canvas {
  height: 100px;
}
.casting-panel .trace-box .fine {
  font-size: 11px;
  padding: 0 6px 6px;
  min-height: 24px;
}
.casting-panel .btn {
  min-height: 48px;
  padding: 10px 6px;
  font-size: 15px;
}
.quiz-mode #stage {
  height: 192px;
}
.quiz-mode #stage-wrap {
  margin-bottom: 10px;
}
.quiz-mode .stage-foot,
.quiz-mode .stage-help,
.quiz-mode .spellbook-pocket {
  display: none;
}
.quiz-mode #content {
  gap: 10px;
}
.quiz-mode .panel {
  padding: 12px;
  gap: 9px;
}
.quiz-mode .quote {
  font-size: 16px;
  line-height: 1.2;
  margin: 0;
}
.quiz-mode .question {
  font-size: 20px;
  line-height: 1.2;
  margin: 0;
}
.quiz-mode .answers {
  gap: 6px;
}
.quiz-mode .answers .btn {
  min-height: 48px;
  padding: 8px 10px;
  font-size: 14px;
}
.quiz-mode #content > .btn {
  min-height: 44px;
  padding: 8px;
}
.swatches {
  display: grid;
  grid-template-columns: repeat(var(--swatch-columns), minmax(0, 1fr));
  justify-items: center;
  gap: 9px;
}
.swatches .choice {
  width: 48px;
  height: 48px;
  min-height: 48px;
}
.wood-chip {
  display: inline-block;
  flex: none;
  width: 25px;
  height: 25px;
  border-radius: 7px;
  border: 1px solid #3f291f45;
  background:
    repeating-linear-gradient(
      15deg,
      transparent 0 4px,
      #39241c25 5px,
      transparent 6px 9px),
    var(--wood);
}
@media (max-height: 650px) and (orientation: portrait) {
  .editor-mode #stage,
  .spells-mode #stage,
  .pets-mode #stage {
    height: 164px;
  }
  .editor-mode .stage-help,
  .spells-mode .stage-help,
  .pets-mode .stage-help {
    display: none;
  }
  .editor-mode #stage-wrap {
    position: sticky;
  }
}
@media (max-width: 360px) {
  .spells-mode .tabbar .icon {
    display: none;
  }
}
@media (min-width: 560px) and (max-height: 500px) and (orientation: landscape) {
  #app {
    max-width: none;
    padding: 8px 16px 120px;
    display: grid;
    grid-template-columns: minmax(240px, 42%) minmax(0, 1fr);
    column-gap: 20px;
    align-items: start;
  }
  .mast {
    display: none;
  }
  #intro {
    grid-column: 2;
    padding: 0 0 12px;
    margin: 0;
  }
  #intro h1 {
    font-size: 25px;
  }
  #intro .eyebrow,
  #intro > p {
    display: none;
  }
  #stage-wrap,
  .editor-mode #stage-wrap,
  .spells-mode #stage-wrap,
  .pets-mode #stage-wrap {
    grid-column: 1;
    grid-row: 1 / span 5;
    position: sticky;
    top: 8px;
    margin: 0;
    padding: 0;
  }
  #stage,
  .home-mode #stage,
  .spells-mode #stage,
  .pets-mode #stage,
  .quiz-mode #stage {
    height: calc(100dvh - 100px);
  }
  .editor-mode #stage {
    height: calc(100dvh - 160px);
  }
  #stage-foot {
    display: none;
  }
  #content,
  #toast,
  #storage-note {
    grid-column: 2;
    min-width: 0;
  }
  #content {
    grid-row: 3;
  }
  #toast {
    grid-row: 2;
  }
  #stage .stage-label {
    font-size: 8px;
    letter-spacing: .6px;
    padding: 7px;
  }
  .stage-help {
    display: none;
  }
  .casting-panel .trace-box canvas {
    height: 100px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *:before,
  *:after {
    animation-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .house-moment,
  .house-visitor,
  .wand-moment {
    animation: none;
    opacity: 1;
    transform: none;
  }
}
:root {
  --paper:#111b22;
  --card:#e9dfc9;
  --ink:#24251f;
  --muted:#71644e;
  --purple:#a88442;
  --gold:#d1ad67;
  --line:#a38e6155;
  --mint:#b5c1ad;
  --display:"Cormorant Garamond",Georgia,serif;
}
body {
  background:
    radial-gradient(
      ellipse at 50% 0,
      #27363d 0,
      #111b22 50%,
      #0c141b 100%);
  color: #eee2c8;
}
h1 {
  font-size: 36px;
  letter-spacing: -.5px;
}
h2 {
  font-size: 27px;
}
h3 {
  font-size: 23px;
}
.mast {
  border-color: #c2a36635;
}
.brand-name {
  color: #f1e2bd;
}
.brand-name small {
  color: #c0ae86;
}
.brandmark {
  background: #243038;
  color: #d4b578;
  border: 1px solid #9e8148;
  border-radius: 8px;
}
.round,
.back {
  background: #1d2b34;
  border: 1px solid #a38e6166;
  color: #dfc48c;
  border-radius: 8px;
}
.round[aria-pressed=true] {
  background: #ac8948;
  color: #101b23;
  border-color: #dbbf80;
}
#intro p,
.stage-foot,
.section-head small,
.fine {
  color: #bcb39e;
}
.panel,
.empty,
.character-card,
.tile,
.spell-card,
.pet-card,
.inbox-letter,
.quiz-card {
  background:
    linear-gradient(
      110deg,
      #eee5d1,
      #e1d3b6);
  color: #24251f;
  border-color: #a18a5e;
  box-shadow: 0 7px 22px #0002;
}
:is(.panel, .empty, .character-card, .tile, .spell-card, .pet-card, .inbox-letter, .quiz-card) .fine,
:is(.panel, .empty, .character-card, .tile, .spell-card, .pet-card, .inbox-letter, .quiz-card) small {
  color: #71644e;
}
:is(.panel, .tile, .character-card, .empty, .spell-card, .pet-card, .quiz-card, .choice, .btn, .tabbar button) {
  border-radius: 8px;
}
#stage {
  border: 1px solid #a68e58;
  border-radius: 12px;
  background: #142129;
  box-shadow: 0 14px 35px #0006;
}
.stage-label,
.stage-help,
.stage-reset,
