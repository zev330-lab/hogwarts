<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hogwarts">
<meta name="theme-color" content="#faf4e7">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Havi's own little world of witches, wizards, and wonderful magic.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Havi's Hogwarts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:wght@500;600;700&display=swap">
<style>
:root {
  --paper:#faf4e7;
  --card:#fffdf7;
  --ink:#302c3c;
  --muted:#72677a;
  --purple:#655183;
  --gold:#ad7931;
  --line:#e7dcc8;
  --mint:#dcece4;
  --display:"Fraunces",Georgia,serif;
  --body:"Atkinson Hyperlegible","Trebuchet MS",sans-serif;
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
  color: inherit;
  touch-action: manipulation;
}
button:active {
  transform: translateY(1px);
}
button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 3px solid #a676d2;
  outline-offset: 3px;
}
[hidden] {
  display: none !important;
}
button {
  min-height: 48px;
}
button:disabled {
  opacity: .5;
  cursor: default;
}
svg {
  display: block;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-family: var(--display);
  font-weight: 600;
  line-height: 1.15;
}
h1 {
  font-size: 34px;
  letter-spacing: -1.1px;
}
h2 {
  font-size: 25px;
}
h3 {
  font-size: 20px;
}
p {
  line-height: 1.5;
}
small,
.fine {
  font-size: 14px;
  color: var(--muted);
}
.icon {
  width: 23px;
  height: 23px;
  flex: none;
  display: inline-block;
  vertical-align: middle;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 2.3px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--gold);
}
#app {
  max-width: 560px;
  margin: auto;
  padding: 0 18px calc(132px + env(safe-area-inset-bottom, 0px));
}
html {
  scroll-padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
}
button,
input,
select,
textarea {
  scroll-margin-block: 18px 115px;
}
.mast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(15px + env(safe-area-inset-top, 0px)) 0 17px;
  border-bottom: 1px solid var(--line);
}
.brand {
  border: 0;
  background: none;
  text-align: left;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 9px;
  flex: 1;
}
.brandmark {
  color: #9b7138;
  background: #efe4cf;
  border: 1px solid #d8c19a;
  border-radius: 14px;
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
}
.brand-name {
  font-family: var(--display);
  font-size: 21px;
  line-height: 1.1;
}
.brand-name small {
  display: block;
  font-family: var(--body);
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--muted);
  margin-top: 4px;
}
.round {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  flex: none;
}
.round[aria-pressed=true] {
  color: #fff;
  background: var(--purple);
  border-color: var(--purple);
}
.intro {
  padding: 24px 3px 19px;
}
.intro .eyebrow {
  margin-bottom: 7px;
}
.intro p {
  margin-top: 9px;
  font-size: 16px;
  color: var(--muted);
}
.intro-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.intro-row > div {
  min-width: 0;
}
.intro h1 {
  overflow-wrap: anywhere;
}
.intro .back {
  margin-left: -4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 15px;
  width: 48px;
  flex: none;
  display: grid;
  place-items: center;
}
.intro .back svg {
  width: 20px;
}
#stage-wrap {
  position: relative;
  margin-bottom: 18px;
  z-index: 2;
}
#stage {
  height: 316px;
  position: relative;
  border-radius: 26px;
  overflow: hidden;
  background: #182c3d;
  isolation: isolate;
  border: 1px solid #cdbb9b;
  box-shadow: 0 9px 23px -17px #302239;
}
#stage canvas.gl,
#fallback {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
#fallback > svg {
  width: 100%;
  height: 100%;
}
#stage.is3d #fallback {
  display: none;
}
#stage canvas.gl {
  z-index: 1;
}
.stage-label {
  position: absolute;
  left: 10px;
  top: 10px;
  color: #f5e7c8;
  font-size: 10px;
  letter-spacing: 1.2px;
  max-width: calc(100% - 72px);
  background: #18263ee8;
  border: 1px solid #eddab540;
  border-radius: 20px;
  padding: 7px 10px;
  z-index: 3;
  pointer-events: none;
}
.stage-help {
  position: absolute;
  bottom: 12px;
  left: 12px;
  max-width: calc(100% - 80px);
  border: 1px solid #f7e9c329;
  background: #1c283cc7;
  color: #f9f0df;
  white-space: normal;
  border-radius: 20px;
  font-size: 11px;
  padding: 5px 11px;
  z-index: 3;
  pointer-events: none;
}
.stage-reset {
  position: absolute;
  right: 9px;
  top: 6px;
  z-index: 4;
  color: #f5e7c8;
  background: #192a3c70;
  border: 0;
  border-radius: 50%;
  width: 48px;
  display: grid;
  place-items: center;
}
.stage-reset .icon {
  width: 18px;
}
#effect-label {
  position: absolute;
  top: 54px;
  left: 20px;
  right: 20px;
  text-align: center;
  color: #fff6d8;
  font-family: var(--display);
  font-size: 23px;
  text-shadow: 0 2px 6px #141524;
  z-index: 4;
  pointer-events: none;
}
#fx2d {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
}
.spark svg {
  width: 34px;
  height: 38px;
}
.spark {
  position: absolute;
  font-size: 26px;
  color: var(--spark,#ffe49a);
  animation: spark 2.5s ease-out forwards;
}
@keyframes spark {
  0% {
    transform: translate(0, 80px) scale(.1);
    opacity: 0;
  }
  15% {
    opacity: 1;
  }
  100% {
    transform: translate(var(--dx), -160px) rotate(170deg);
    opacity: 0;
  }
}
.editor-mode #stage {
  height: 280px;
}
.editor-mode #stage-wrap {
  position: sticky;
  top: 8px;
  background: var(--paper);
  padding-bottom: 8px;
}
.home-mode #stage {
  height: 292px;
}
.stage-foot {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 13px;
}
.stage-foot::before,
.stage-foot::after {
  content: "✧";
  color: var(--gold);
}
#content {
  display: grid;
  gap: 20px;
}
.btn {
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--card);
  padding: 12px 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  min-height: 50px;
  text-decoration: none;
  line-height: 1.3;
}
.btn.primary {
  background: var(--purple);
  color: white;
  border-color: var(--purple);
  box-shadow: 0 4px 0 #49365e;
}
.btn.gold {
  background: #efcc88;
  color: #49351b;
  border-color: #dfba73;
  box-shadow: 0 4px 0 #c39a54;
}
.btn.wide {
  width: 100%;
}
.btn.soft {
  background: #eee7f3;
  border-color: #ded3e9;
  color: #594371;
}
.btn.danger {
  color: #a13946;
  border-color: #e1bcc2;
  background: #fff5f5;
}
.row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.row > * {
  min-width: 0;
}
.row.equal > * {
  flex: 1;
}
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.section-head small {
  font-size: 12px;
}
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  margin-top: 2px;
}
.divider:before,
.divider:after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 21px;
  padding: 18px;
  display: grid;
  gap: 15px;
}
.panel.lavender {
  background: #f1ebf6;
  border-color: #e0d5e9;
}
.panel.green {
  background: #edf4ed;
  border-color: #cfded1;
}
.panel .fine {
  line-height: 1.4;
}
.stack {
  display: grid;
  gap: 16px;
}
.cards,
.tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.character-card {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card);
  overflow: hidden;
  text-align: center;
}
.character-card > button {
  width: 100%;
  border: 0;
  background: none;
  padding: 0 0 15px;
}
.portrait {
  height: 168px;
  background:
    radial-gradient(
      ellipse at 50% 70%,
      #e5ded6,
      #f1e9de);
  border-bottom: 1px solid var(--line);
  margin-bottom: 13px;
}
.portrait svg {
  width: 100%;
  height: 100%;
}
.character-card h3 {
  font-size: 19px;
  margin: 0 9px 4px;
  overflow-wrap: anywhere;
}
.character-card small {
  font-size: 12px;
}
.card-menu {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 48px !important;
  height: 48px;
  background: #fff9 !important;
  border-radius: 50%;
  padding: 0 !important;
  font-size: 25px;
}
.empty {
  text-align: center;
  padding: 18px 20px 6px;
}
.empty h2 {
  font-size: 24px;
  margin-bottom: 7px;
}
.empty p {
  color: var(--muted);
  font-size: 15px;
}
.tile {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 21px;
  background: #eee8f4;
  min-height: 128px;
  padding: 16px;
  text-align: left;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  gap: 13px;
}
.tile > span:first-child {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: #ffffff8c;
  display: grid;
  place-items: center;
  color: #6c537f;
}
.tile b {
  font-family: var(--display);
  font-size: 19px;
  font-weight: 600;
}
.tile small {
  display: block;
  font-size: 12px;
  margin-top: 4px;
}
.tile:nth-child(4n+2) {
  background: #f2e5cd;
}
.tile:nth-child(4n+3) {
  background: #e2ece3;
}
.tile:nth-child(4n) {
  background: #e0e8f0;
}
.tile .arrow {
  position: absolute;
  right: 13px;
  top: 18px;
  color: #8b7b80;
}
.house-cup {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  text-align: center;
}
.house-cup .crest {
  width: 48px;
  height: 58px;
  margin: auto;
}
.house-cup strong {
  display: block;
  font-family: var(--display);
  font-size: 22px;
  margin-top: 5px;
}
.house-cup small {
  font-size: 10px;
  display: block;
  color: var(--muted);
}
.cup-bar {
  height: 4px;
  border-radius: 3px;
  background: var(--house);
  margin: 8px 8px 0;
}
.crest {
  display: inline-block;
  width: 46px;
  height: 54px;
  vertical-align: middle;
}
.house-picker {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.house-picker button {
  display: grid;
  justify-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px 6px;
  background: var(--card);
  font-size: 15px;
}
.house-picker .crest {
  width: 53px;
  height: 64px;
}
.house-picker small {
  font-size: 12px;
}
.quote {
  font-family: var(--display);
  font-size: 22px;
  line-height: 1.4;
  text-align: center;
  color: #604c77;
}
.question {
  font-size: 24px;
  text-align: center;
}
.answers {
  display: grid;
  gap: 9px;
}
.answers .btn {
  text-align: left;
  justify-content: flex-start;
  font-weight: 400;
}
.progress {
  display: flex;
  justify-content: center;
  gap: 7px;
}
.progress i {
  display: block;
  width: 23px;
  height: 5px;
  border-radius: 5px;
  background: #ddd1e6;
}
.progress i.on {
  background: var(--purple);
}
.tabbar {
  display: flex;
  gap: 7px;
  overflow: auto;
  scrollbar-width: none;
  padding: 2px 1px 8px;
}
.tabbar::-webkit-scrollbar {
  display: none;
}
.tabbar button {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 48px;
  padding: 9px 13px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--card);
  font-size: 14px;
}
.tabbar button[aria-selected=true] {
  background: var(--ink);
  border-color: var(--ink);
  color: white;
}
.tabbar .icon {
  width: 18px;
}
.choices {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.choice {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 13px;
  min-height: 48px;
  padding: 9px 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 15px;
  flex-grow: 1;
}
.choice[aria-pressed=true] {
  background: #eee6f4;
  border: 2px solid #88739d;
  padding: 8px 12px;
  color: #49365e;
}
.choice .dot {
  width: 21px;
  height: 21px;
  background: var(--swatch);
  border-radius: 50%;
  border: 1px solid #0002;
  display: inline-block;
  box-shadow: inset 0 0 0 3px #ffffff25;
}
.swatches .choice {
  flex: 0;
  width: 50px;
  height: 50px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
}
.swatches .dot {
  width: 34px;
  height: 34px;
}
.field {
  display: grid;
  gap: 9px;
}
.field > label,
.field-label {
  font-size: 15px;
  font-weight: 700;
}
.field input,
.field select,
.field textarea,
input.text {
  width: 100%;
  min-width: 0;
  background: #fffdf8;
  color: var(--ink);
  border: 1px solid #d7c9b3;
  border-radius: 13px;
  padding: 12px;
  min-height: 49px;
  font-size: 17px;
}
.field textarea {
  resize: vertical;
  min-height: 112px;
}
.field input[type=range] {
  padding: 0;
  accent-color: var(--purple);
  border: 0;
}
.field-label small {
  font-weight: 400;
}
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.note {
  border-left: 3px solid #c8a764;
  padding: 0 0 0 13px;
  color: var(--muted);
  font-size: 14px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 20px;
  background: #eee6f4;
  padding: 5px 11px;
  font-size: 12px;
  color: #5d4777;
}
.pet-preview {
  font-size: 38px;
  text-align: center;
}
.pet-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}
.pet-grid button {
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  padding: 8px 4px;
  font-size: 13px;
  min-height: 102px;
}
.pet-grid button[aria-pressed=true] {
  background: #eee6f4;
  border: 2px solid #88739d;
  padding: 7px 3px;
}
.pet-grid svg {
  width: 65px;
  height: 58px;
  margin: auto auto 5px;
}
.spell-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}
.spell-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 13px 9px;
  text-align: left;
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 74px;
}
.spell-card[aria-pressed=true] {
  background: #eee6f4;
  border: 2px solid #88739d;
  padding: 12px 8px;
}
.spell-card b {
  font-size: 14px;
  display: block;
  overflow-wrap: anywhere;
}
.spell-card small {
  display: block;
  font-size: 12px;
}
.spell-card .symbol {
  font-size: 23px;
}
.trace-box {
  border: 1px dashed #b49bc7;
  border-radius: 17px;
  background: #f8f3fd;
  position: relative;
  overflow: hidden;
}
.trace-box canvas {
  display: block;
  width: 100%;
  height: 144px;
  touch-action: none;
}
.trace-box .fine {
  text-align: center;
  display: block;
  padding: 0 5px 8px;
  font-size: 12px;
}
.spell-title {
  display: flex;
  gap: 10px;
  align-items: center;
}
.spell-title > span {
  font-size: 31px;
}
.spell-title h2 {
  font-size: 23px;
}
.spell-title p {
  font-size: 14px;
  color: var(--muted);
}
.syllables {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.syllables button {
  border: 1px solid #d4c4e0;
  border-radius: 12px;
  background: #f3ecf8;
  padding: 9px 12px;
  color: #614b7b;
}
.letter {
  background: #fff8e5;
  padding: 25px 22px;
  border: 1px solid #dfc99b;
  border-radius: 4px;
  box-shadow: 0 6px 18px #563e2110;
  display: grid;
  gap: 17px;
  position: relative;
}
.letter:before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid #e7d5ad;
  pointer-events: none;
}
.letter h2 {
  text-align: center;
  font-size: 25px;
}
.letter p {
  font-size: 16px;
}
.letter .signature {
  font-family: var(--display);
  font-style: italic;
  color: #87632d;
}
.seal {
  border: 5px double #b55b60;
  border-radius: 50%;
  width: 78px;
  height: 78px;
  min-height: 78px;
  background: #a44852;
  color: #ffe6ab;
  box-shadow: 0 6px 0 #82353f, 0 9px 14px #682e3733;
  margin: 10px auto;
  font-family: var(--display);
  font-size: 30px;
}
.owl-flight {
  animation: owlFlight 2.2s ease-in-out;
  transform-origin: center;
  margin: auto;
  width: 110px;
  height: 90px;
}
.owl-flight svg {
  width: 100%;
  height: 100%;
}
@keyframes owlFlight {
  from {
    transform: translate(-150px, -80px) rotate(-20deg);
    opacity: 0;
  }
  60% {
    transform: translate(15px, 0) rotate(10deg);
  }
  to {
    transform: none;
    opacity: 1;
  }
}
.inbox-letter {
  padding: 15px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 14px;
}
.inbox-letter p {
  overflow-wrap: anywhere;
  margin-top: 7px;
